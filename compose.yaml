services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: baslon_os
      POSTGRES_USER: baslon
      POSTGRES_PASSWORD: baslon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baslon -d baslon_os"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - baslon-postgres:/var/lib/postgresql/data

volumes:
  baslon-postgres:
